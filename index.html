<!DOCTYPE html>
<html>
<head>
  <title>Hash Research Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>
  <h1>$HASH Mint Test Results</h1>
  <table id="results">
    <thead>
      <tr>
        <th>Wallet</th>
        <th>Status</th>
        <th>TX Hash</th>
        <th>Gas Used</th>
        <th>Notes</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="6">Loading...</td></tr>
    </tbody>
  </table>

  <script>
    const SUPABASE_URL = "https://nybqbageemdmqdvpwdnl.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55YnFiYWdlZW1kbXFkdnB3ZG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTg1ODUsImV4cCI6MjA5NDA5NDU4NX0.g_3RhkYZqUbMYvShd8tOWqHNS87sJ0VZwt3NnB-PYqw";

    async function loadResults() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/mint_tests?order=created_at.desc`, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });
      const data = await res.json();
      const tbody = document.getElementById("tbody");
      if (!data.length) {
        tbody.innerHTML = "<tr><td colspan='6'>No results yet</td></tr>";
        return;
      }
      tbody.innerHTML = data.map(r => `
        <tr>
          <td>${r.wallet_address?.slice(0,12)}...</td>
          <td>${r.status}</td>
          <td>${r.tx_hash ? r.tx_hash.slice(0,12)+"..." : "-"}</td>
          <td>${r.gas_used || "-"}</td>
          <td>${r.notes || "-"}</td>
          <td>${new Date(r.created_at).toLocaleString()}</td>
        </tr>
      `).join("");
    }

    loadResults();
  </script>
</body>
</html>
