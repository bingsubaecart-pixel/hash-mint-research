<!DOCTYPE html>
<html>
<head>
  <title>$HASH Mining Research Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f0f0f; color: #fff; }
    h1 { color: #00ff88; }
    .stats { display: flex; gap: 20px; margin-bottom: 20px; }
    .stat { background: #1a1a1a; padding: 15px 25px; border-radius: 8px; text-align: center; }
    .stat h2 { margin: 0; font-size: 28px; color: #00ff88; }
    .stat p { margin: 5px 0 0; color: #888; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #1a1a1a; padding: 10px; text-align: left; color: #888; font-size: 13px; }
    td { border-bottom: 1px solid #222; padding: 10px; font-size: 13px; }
    .solved { color: #00ff88; }
    .generated { color: #888; }
    .error { color: #ff4444; }
    .refresh { color: #888; font-size: 12px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>$HASH Mining Research Dashboard</h1>
  <div class="stats">
    <div class="stat"><h2 id="total">-</h2><p>Total Wallets</p></div>
    <div class="stat"><h2 id="solved">-</h2><p>Solved</p></div>
    <div class="stat"><h2 id="pending">-</h2><p>Pending</p></div>
    <div class="stat"><h2 id="errors">-</h2><p>Errors</p></div>
  </div>
  <div class="refresh" id="refresh">Loading...</div>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Wallet</th>
        <th>Status</th>
        <th>Notes</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="5">Loading...</td></tr>
    </tbody>
  </table>

  <script>
    const SUPABASE_URL = "https://nybqbageemdmqdvpwdnl.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55YnFiYWdlZW1kbXFkdnB3ZG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTg1ODUsImV4cCI6MjA5NDA5NDU4NX0.g_3RhkYZqUbMYvShd8tOWqHNS87sJ0VZwt3NnB-PYqw";

    async function load() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/mint_tests?order=created_at.desc&limit=200`, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });
      const data = await res.json();

      // Stats
      const solved = data.filter(r => r.status === "solved").length;
      const pending = data.filter(r => r.status === "generated").length;
      const errors = data.filter(r => r.status === "error").length;

      document.getElementById("total").textContent = data.length;
      document.getElementById("solved").textContent = solved;
      document.getElementById("pending").textContent = pending;
      document.getElementById("errors").textContent = errors;
      document.getElementById("refresh").textContent = `Last updated: ${new Date().toLocaleTimeString()} · Auto-refreshes every 10s`;

      // Table
      const tbody = document.getElementById("tbody");
      if (!data.length) {
        tbody.innerHTML = "<tr><td colspan='5'>No data yet</td></tr>";
        return;
      }
      tbody.innerHTML = data.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${r.wallet_address?.slice(0,14)}...</td>
          <td class="${r.status}">${r.status}</td>
          <td>${r.notes?.slice(0,40) || "-"}</td>
          <td>${new Date(r.created_at).toLocaleTimeString()}</td>
        </tr>
      `).join("");
    }

    load();
    setInterval(load, 10000); // refresh every 10 seconds
  </script>
</body>
</html>
