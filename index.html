<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$HASH Mining Research Dashboard</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Courier New',monospace;background:#0a0a0a;color:#e0e0e0;padding:28px;min-height:100vh}
    h1{font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#00ff88;margin-bottom:4px}
    .sub{font-size:11px;color:#444;letter-spacing:2px;margin-bottom:24px}
    .stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
    .stat{background:#111;border:1px solid #1a1a1a;border-radius:8px;padding:16px 24px;min-width:130px;text-align:center}
    .stat h2{font-size:30px;font-weight:700;color:#e0e0e0;margin-bottom:4px}
    .stat h2.green{color:#00ff88}
    .stat h2.red{color:#ff4444}
    .stat h2.yellow{color:#ffaa00}
    .stat p{color:#444;font-size:10px;letter-spacing:2px;text-transform:uppercase}
    .bars{background:#111;border:1px solid #1a1a1a;border-radius:8px;padding:16px 20px;margin-bottom:20px}
    .bar-row{margin-bottom:10px}
    .bar-row:last-child{margin-bottom:0}
    .bar-meta{display:flex;justify-content:space-between;font-size:10px;color:#555;letter-spacing:1px;margin-bottom:5px}
    .track{background:#1a1a1a;border-radius:2px;height:5px;overflow:hidden}
    .fill{height:100%;border-radius:2px;transition:width .6s ease}
    .fill-green{background:#00ff88}
    .fill-red{background:#ff4444}
    .fill-gray{background:#333}
    .refresh{font-size:10px;color:#333;letter-spacing:1px;margin-bottom:12px}
    .refresh span{color:#00ff88}
    .tbl-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:12px}
    thead tr{background:#111}
    th{padding:10px 12px;text-align:left;color:#444;font-size:10px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #1a1a1a;white-space:nowrap}
    td{padding:9px 12px;border-bottom:1px solid #141414;font-family:'Courier New',monospace}
    tr:hover td{background:#0d0d0d}
    .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;letter-spacing:1px;font-weight:700;text-transform:uppercase}
    .solved .badge{background:#002211;color:#00ff88;border:1px solid #004422}
    .generated .badge{background:#1a1a1a;color:#555;border:1px solid #222}
    .error .badge{background:#220000;color:#ff4444;border:1px solid #440000}
    .addr{color:#888}
    .notes{color:#555;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .time{color:#333;white-space:nowrap}
    .num{color:#333}
    .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
    .dot-s{background:#00ff88}
    .dot-e{background:#ff4444}
    .dot-g{background:#333}
    .empty{color:#333;font-size:12px;padding:24px;text-align:center}
    .conn-err{color:#ff4444;font-size:11px;padding:8px 0}
  </style>
</head>
<body>

<h1>$HASH Mining Dashboard</h1>
<p class="sub">Research · Live via Supabase</p>

<div class="stats">
  <div class="stat"><h2 id="total">—</h2><p>Total</p></div>
  <div class="stat"><h2 class="green" id="solved">—</h2><p>Solved</p></div>
  <div class="stat"><h2 class="yellow" id="pending">—</h2><p>Pending</p></div>
  <div class="stat"><h2 class="red" id="errors">—</h2><p>Errors</p></div>
  <div class="stat"><h2 class="green" id="rate">—</h2><p>Success %</p></div>
</div>

<div class="bars">
  <div class="bar-row">
    <div class="bar-meta"><span><span class="dot dot-s"></span>Solved</span><span id="pct-solved">0%</span></div>
    <div class="track"><div class="fill fill-green" id="bar-solved" style="width:0%"></div></div>
  </div>
  <div class="bar-row">
    <div class="bar-meta"><span><span class="dot dot-e"></span>Errors</span><span id="pct-err">0%</span></div>
    <div class="track"><div class="fill fill-red" id="bar-err" style="width:0%"></div></div>
  </div>
  <div class="bar-row">
    <div class="bar-meta"><span><span class="dot dot-g"></span>Pending</span><span id="pct-pend">0%</span></div>
    <div class="track"><div class="fill fill-gray" id="bar-pend" style="width:100%"></div></div>
  </div>
</div>

<div class="refresh" id="refresh">Loading...</div>
<div class="conn-err" id="conn-err"></div>

<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Wallet</th>
        <th>Status</th>
        <th>Notes</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="5" class="empty">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
const SUPABASE_URL = "https://nybqbageemdmqdvpwdnl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55YnFiYWdlZW1kbXFkdnB3ZG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTg1ODUsImV4cCI6MjA5NDA5NDU4NX0.g_3RhkYZqUbMYvShd8tOWqHNS87sJ0VZwt3NnB-PYqw";

async function load() {
  try {
    let all = [], page = 0;
    while (true) {
      const from = page * 500, to = from + 499;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/mint_tests?order=created_at.desc&offset=${from}&limit=500`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
      const chunk = await res.json();
      all = [...all, ...chunk];
      if (chunk.length < 500) break;
      page++;
    }

    document.getElementById("conn-err").textContent = "";

    const solved = all.filter(r => r.status === "solved").length;
    const pending = all.filter(r => r.status === "generated" || r.status === "solving").length;
    const errors = all.filter(r => r.status === "error").length;
    const done = solved + errors;
    const rate = done > 0 ? Math.round(solved / done * 100) : 0;
    const total = all.length;

    document.getElementById("total").textContent = total;
    document.getElementById("solved").textContent = solved;
    document.getElementById("pending").textContent = pending;
    document.getElementById("errors").textContent = errors;
    document.getElementById("rate").textContent = done > 0 ? rate + "%" : "—";

    const sp = total > 0 ? Math.round(solved / total * 100) : 0;
    const ep = total > 0 ? Math.round(errors / total * 100) : 0;
    const pp = total > 0 ? Math.round(pending / total * 100) : 0;

    document.getElementById("bar-solved").style.width = sp + "%";
    document.getElementById("bar-err").style.width = ep + "%";
    document.getElementById("bar-pend").style.width = pp + "%";
    document.getElementById("pct-solved").textContent = sp + "%";
    document.getElementById("pct-err").textContent = ep + "%";
    document.getElementById("pct-pend").textContent = pp + "%";

    document.getElementById("refresh").innerHTML =
      `Last updated: <span>${new Date().toLocaleTimeString()}</span> &nbsp;·&nbsp; ${total} wallets &nbsp;·&nbsp; auto-refresh every 10s`;

    const tbody = document.getElementById("tbody");
    if (!all.length) {
      tbody.innerHTML = "<tr><td colspan='5' class='empty'>No data yet</td></tr>";
      return;
    }
    tbody.innerHTML = all.map((r, i) => `
      <tr class="${r.status}">
        <td class="num">${i + 1}</td>
        <td class="addr">${r.wallet_address ? r.wallet_address.slice(0,10) + "..." + r.wallet_address.slice(-6) : "—"}</td>
        <td><span class="badge">${r.status}</span></td>
        <td class="notes">${r.notes ? r.notes.slice(0, 50) : "—"}</td>
        <td class="time">${r.created_at ? new Date(r.created_at).toLocaleTimeString() : "—"}</td>
      </tr>`).join("");

  } catch (e) {
    document.getElementById("conn-err").textContent = "Error: " + e.message;
    document.getElementById("refresh").textContent = "Failed to load — retrying...";
  }
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
